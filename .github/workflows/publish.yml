# Publish @fno2010/dsh-web-search-ext to npm via trusted publishing (OIDC).
# No npm token is stored anywhere in this repo.
#
# One-time bootstrap (in this order):
#   1. First version is published locally:
#        npm login && npm publish --access public
#      (a package must exist on the registry before its trusted publisher
#       can be configured)
#   2. npmjs.com -> package @fno2010/dsh-web-search-ext -> Settings ->
#      Trusted Publisher -> GitHub Actions:
#        Organization or user: fno2010
#        Repository:           dsh-web-search-ext
#        Workflow filename:    publish.yml
#        Allowed actions:      npm publish
#   3. From then on, every release is: bump "version" in package.json,
#      commit, tag vX.Y.Z, push the tag -> this workflow publishes.
#
# Notes:
#   - The published version is whatever package.json says at the tagged
#     commit; tag it only after the version bump commit.
#   - Part B live smoke is skipped in CI (CI env var); Part A is mocked.
#   - Provenance attestations are generated automatically under trusted
#     publishing; --provenance is kept explicit.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test (Part A; Part B live smoke skipped in CI)
        run: npm test
      # Never publish a tarball whose committed client bundle drifts from
      # src/client/ (the tag may predate a final client/ fix).
      - name: Verify committed client bundle is in sync
        run: |
          npm run build:client
          node --check client/client.js
          git diff --exit-code -- client/

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish to npm (trusted publishing, no token)
        # Idempotent guard: if the version declared at this tag already exists
        # on the registry (re-created tag, retag, accidental republish), skip
        # with a notice instead of failing on E409/ETARGET.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published to the registry — skipping publish."
            exit 0
          fi
          npm publish --provenance --access public
