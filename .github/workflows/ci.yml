# Continuous integration: run the test suite on every push to main and every
# pull request. This is the merge gate — publishing is NOT done here.
#
# Publishing lives in publish.yml (tag-triggered, trusted publishing / OIDC).
# Part B (live keyless smoke) is skipped in CI (CI env var); Part A is mocked.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test (Part A; Part B live smoke skipped in CI)
        run: npm test
      # The published tarball ships the committed client/client.js (the npm
      # publish job never builds it), so the committed bundle must stay in
      # sync with src/client/. Rebuild and fail on drift.
      - name: Verify committed client bundle is in sync
        run: |
          npm run build:client
          node --check client/client.js
          git diff --exit-code -- client/
  # Host-wiring end-to-end: install the REAL harness from npm, add this plugin
  # to a fresh web profile exactly the way the README instructs
  # (`dsh plugin --profile web add <path>`), then dump the composed host
  # config and verify the REAL composed state:
  #   (a) our provider is pinned on the web seam for search AND fetch;
  #   (b) the profile-layer tool-web row is DISABLED by the web profile
  #       (upstream decision, asserted honestly — the 0.3.1 false green was
  #       a fixture that omitted this layer and asserted a row the host
  #       never composes enabled);
  #   (c) our provider row is mounted and enabled.
  # The model-facing web_fetch registration (plugin apply-time, via
  # dsh-tool-web's applyWebFetchTool) is covered by test/tool-registration.test.mjs;
  # the actual model→tool call is covered by the release-time live smoke
  # (AGENTS.md, Releasing step 1).
  #
  # Pinned to the harness line the composition test fixture mirrors
  # (dsh-base 0.1.1-rc.2). Bump both together when the harness moves.
  e2e-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the harness (pinned)
        run: npm install -g --no-audit --no-fund @deepseek-ai/dsh@0.1.1-rc.2
      - name: Ensure pnpm (profile install uses it)
        run: pnpm --version || npm install -g pnpm
      - name: Install this plugin into a fresh web profile (README path)
        run: dsh plugin --profile web add "$GITHUB_WORKSPACE"
      - name: Verify the composed host config
        run: |
          dump="$(dsh web --dump-config 2>&1)" || { echo "$dump"; exit 1; }
          echo "$dump"
          # Print one `- id: <name>` row (up to the next `- id:` line).
          row() { awk -v id="- id: $1" '/^- id: /{inrow=($0==id)} inrow{print}' <<<"$dump"; }
          set -e
          web_row="$(row web)"
          grep -q "searchProvider: web-search-ext" <<<"$web_row"
          grep -q "fetchProvider: web-search-ext" <<<"$web_row"
          # Honest assertion (the 0.3.1 false green asserted `fetch: true`
          # here): in the web profile the composed tool-web row is DISABLED
          # by the web profile, with the base config intact under the flag.
          tw_row="$(row tool-web)"
          grep -q "disabled: true" <<<"$tw_row"
          grep -q "fetch: false" <<<"$tw_row"
          # Our provider row is mounted and not disabled.
          ws_row="$(row web-search-ext)"
          [ -n "$ws_row" ]
          ! grep -q "disabled: true" <<<"$ws_row"
          # A healthy composition applies every patch entry of ours.
          if grep -E "patch: .*not found|name mismatch" <<<"$dump"; then
            echo "e2e-host: FAILED — a patch entry was skipped"; exit 1
          fi
          echo "e2e-host: composed config OK (web pinned to web-search-ext, provider enabled, tool-web disabled as the web profile composes it)"
